# Server Configuration
server.port=8080
server.servlet.context-path=/neerjaPhysiotherpyClinic
server.compression.enabled=true
server.servlet.session.timeout=30m

# Session & Idle Timeout Configuration (in milliseconds)
# Default: 600000 ms = 10 minutes
# Configurable idle timeout for auto-logout feature (client-side)
app.session.idle-timeout-ms=600000
app.session.warning-before-logout-ms=60000

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/neerja_physio?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.neerjaphysio=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration

spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Application Configuration
spring.application.name=Neerja Physiotherapy Management System
spring.application.version=1.0.0

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
